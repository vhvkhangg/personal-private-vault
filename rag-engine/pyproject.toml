[project]
name = "ppv-rag"
version = "0.1.0"
description = "Personal Private Vault minimal RAG engine worker service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "psycopg[binary]==3.3.6",
    "pypdf==6.21.1",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "onnxruntime==1.31.0",
    "numpy==2.5.4",
    "pillow==12.3.0",
    "tokenizers>=0.21.0",
    "rapidocr-onnxruntime>=1.4.0",
    "pdfplumber==0.11.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "xlwt>=1.3.0",
]
