[project]
name = "ppv-rag"
version = "0.1.0"
description = "Personal Private Vault minimal RAG engine worker service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "psycopg[binary]==3.3.6",
    "onnxruntime==1.31.0",
    "numpy==2.5.4",
    "tokenizers>=0.21.0",
    "pyyaml==6.0.3",
    "markdown-it-py==4.2.0",
    "mdit-py-plugins==0.6.1",
    "html5lib==1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
# P19-S19-2 — SUSPENDED / NOT_ACCEPTED / ARCHIVAL_ONLY; no runtime provisioning authorized.
# Authority: docs/implementation/phase-19/owner-decision-s19-2-source-archival-only-2026-10-31.md.
qa = [
    "llama-cpp-python==0.3.36",
    "diskcache==5.6.3",
    "jinja2==3.1.6",
    "markupsafe==3.0.4",
]

[tool.uv.sources]
llama-cpp-python = { url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.36/llama_cpp_python-0.3.36-py3-none-win_amd64.whl" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
cache_dir = "nul"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
