<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2360 1160" width="2360" height="1160" style="background:#ffffff; font-family:Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4B5563" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9CA3AF" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="1180" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#0F172A">Personal Private Vault — C4 Container</text>
  <text x="1180" y="66" text-anchor="middle" font-size="13" fill="#475569">Current container architecture reflecting accepted baseline, immutable snapshots, RAG workers, and suspended QA</text>

  <!-- ==================== BOUNDARY: Personal Private Vault ==================== -->
  <rect x="250" y="90" width="1720" height="880" rx="14" fill="#F8FAFC" stroke="#1168BD" stroke-width="2.5" />
  <text x="275" y="122" font-size="17" font-weight="bold" fill="#1168BD">Personal Private Vault</text>
  <text x="275" y="142" font-size="12" fill="#64748B">[Software System — Single-User Private Vault Monolith + Local Workers]</text>

  <!-- ==================== EXTERNAL: Owner ==================== -->
  <g transform="translate(45, 420)">
    <rect width="170" height="130" rx="10" fill="#08427B" stroke="#06345F" stroke-width="2" filter="url(#shadow)" />
    <text x="85" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Owner</text>
    <text x="85" y="52" text-anchor="middle" font-size="11" fill="#93C5FD">[Person]</text>
    <text x="85" y="78" text-anchor="middle" font-size="11" fill="#E0F2FE">Single permanent user</text>
    <text x="85" y="96" text-anchor="middle" font-size="11" fill="#E0F2FE">of Personal Private Vault</text>
  </g>

  <!-- ==================== CONTAINER: Web Application ==================== -->
  <g transform="translate(290, 420)">
    <rect width="270" height="130" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)" />
    <text x="135" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E293B">Web Application</text>
    <text x="135" y="50" text-anchor="middle" font-size="12" fill="#475569">Next.js + TypeScript + shadcn/ui</text>
    <text x="135" y="75" text-anchor="middle" font-size="11" fill="#334155">Browser UI for vault management</text>
    <rect x="25" y="95" width="220" height="22" rx="4" fill="#FEF3C7" stroke="#D97706" />
    <text x="135" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#B45309">[PROPOSED / Future frontend phase]</text>
  </g>

  <!-- ==================== CONTAINER: Backend API ==================== -->
  <g transform="translate(620, 390)">
    <rect width="330" height="195" rx="10" fill="#438DD5" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)" />
    <text x="165" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Backend API</text>
    <text x="165" y="54" text-anchor="middle" font-size="12" fill="#E0F2FE">Java 25 LTS + Spring Boot + Spring Modulith</text>
    <text x="165" y="80" text-anchor="middle" font-size="11" fill="#FFFFFF">REST API • modular monolith • jobs • search</text>
    <text x="165" y="100" text-anchor="middle" font-size="11" fill="#FFFFFF">RAG source authority &amp; batch finalization gate</text>
    <text x="165" y="120" text-anchor="middle" font-size="11" fill="#DBEAFE">Dynamic query loopback &amp; reader exclusion</text>
    <rect x="105" y="150" width="120" height="24" rx="4" fill="#22C55E" />
    <text x="165" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">[ACCEPTED]</text>
  </g>

  <!-- ==================== CONTAINER: Immutable ORIGINAL_BYTES Store ==================== -->
  <g transform="translate(1120, 160)">
    <rect width="360" height="130" rx="10" fill="#DCE6F1" stroke="#4F81BD" stroke-width="2" filter="url(#shadow)" />
    <text x="180" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F497D">Immutable ORIGINAL_BYTES Store</text>
    <text x="180" y="50" text-anchor="middle" font-size="12" fill="#1F497D">Configured snapshot root / Java authority</text>
    <text x="180" y="74" text-anchor="middle" font-size="11" fill="#334155">Approved snapshot files • SHA-256 NO_CHANGE</text>
    <rect x="80" y="92" width="200" height="22" rx="4" fill="#DBEAFE" stroke="#3B82F6" />
    <text x="180" y="107" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">[ACCEPTED / INACTIVE]</text>
  </g>

  <!-- ==================== CONTAINER: Document Indexing Worker ==================== -->
  <g transform="translate(1120, 330)">
    <rect width="360" height="130" rx="10" fill="#BDD7EE" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)" />
    <text x="180" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F497D">Document Indexing Worker</text>
    <text x="180" y="50" text-anchor="middle" font-size="12" fill="#1F497D">Python 3.14.4 / Obsidian Markdown (.md)</text>
    <text x="180" y="74" text-anchor="middle" font-size="11" fill="#334155">Job-scoped producer • restricted staging</text>
    <rect x="75" y="92" width="210" height="22" rx="4" fill="#DBEAFE" stroke="#3B82F6" />
    <text x="180" y="107" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">[ACCEPTED P18 / INACTIVE]</text>
  </g>

  <!-- ==================== CONTAINER: Query Embedding Worker ==================== -->
  <g transform="translate(1120, 500)">
    <rect width="360" height="140" rx="10" fill="#BDD7EE" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)" />
    <text x="180" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F497D">Query Embedding Worker</text>
    <text x="180" y="50" text-anchor="middle" font-size="12" fill="#1F497D">Python 3.14.4 / FastAPI loopback</text>
    <text x="180" y="74" text-anchor="middle" font-size="11" fill="#334155">Request-bound query embedding (dynamic port)</text>
    <text x="180" y="90" text-anchor="middle" font-size="11" fill="#334155">Guarded reader exclusion (ADR-0025)</text>
    <rect x="65" y="105" width="230" height="22" rx="4" fill="#DBEAFE" stroke="#3B82F6" />
    <text x="180" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">[ACCEPTED S19-1 / DEFAULT_OFF]</text>
  </g>

  <!-- ==================== CONTAINER: Grounded QA Generator (Suspended) ==================== -->
  <g transform="translate(1120, 680)">
    <rect width="360" height="140" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)" />
    <text x="180" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748B">Grounded QA Generator</text>
    <text x="180" y="50" text-anchor="middle" font-size="12" fill="#64748B">Python 3.14.4 / llama.cpp (archival)</text>
    <text x="180" y="74" text-anchor="middle" font-size="11" fill="#64748B">S19-2 suspension decision • zero runtime model</text>
    <text x="180" y="90" text-anchor="middle" font-size="11" fill="#64748B">No inference loaded • execution disabled</text>
    <rect x="25" y="105" width="310" height="22" rx="4" fill="#FEE2E2" stroke="#EF4444" />
    <text x="180" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="#B91C1C">[SUSPENDED / NOT_ACCEPTED / ARCHIVAL_ONLY]</text>
  </g>

  <!-- ==================== CONTAINER: PostgreSQL Database ==================== -->
  <g transform="translate(1660, 340)">
    <!-- Cylinder Shape -->
    <path d="M 0 30 C 0 10, 280 10, 280 30 L 280 215 C 280 235, 0 235, 0 215 Z" fill="#438DD5" stroke="#2E75B6" stroke-width="2" filter="url(#shadow)" />
    <ellipse cx="140" cy="30" rx="140" ry="20" fill="#5B9BD5" stroke="#2E75B6" stroke-width="2" />
    <text x="140" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">PostgreSQL Database</text>
    <text x="140" y="90" text-anchor="middle" font-size="12" fill="#E0F2FE">PostgreSQL 16+ with pgvector</text>
    <text x="140" y="115" text-anchor="middle" font-size="11" fill="#FFFFFF">Structured vault data &amp; metadata</text>
    <text x="140" y="133" text-anchor="middle" font-size="11" fill="#FFFFFF">Vector embeddings (384-dim)</text>
    <text x="140" y="151" text-anchor="middle" font-size="11" fill="#FFFFFF">Restricted staging tables + seal</text>
    <rect x="80" y="174" width="120" height="24" rx="4" fill="#22C55E" />
    <text x="140" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">[ACCEPTED]</text>
  </g>

  <!-- ==================== EXTERNAL: Object Storage ==================== -->
  <g transform="translate(2020, 290)">
    <rect width="290" height="130" rx="10" fill="#64748B" stroke="#475569" stroke-width="2" filter="url(#shadow)" />
    <text x="145" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">S3-Compatible Object Storage</text>
    <text x="145" y="50" text-anchor="middle" font-size="11" fill="#E2E8F0">[External Software System]</text>
    <text x="145" y="75" text-anchor="middle" font-size="11" fill="#FFFFFF">Image/media binaries</text>
    <rect x="55" y="92" width="180" height="22" rx="4" fill="#FEF3C7" stroke="#D97706" />
    <text x="145" y="107" text-anchor="middle" font-size="10" font-weight="bold" fill="#B45309">[ACCEPTED / OPTIONAL]</text>
  </g>

  <!-- ==================== EXTERNAL: Public Feeds ==================== -->
  <g transform="translate(2020, 480)">
    <rect width="290" height="130" rx="10" fill="#64748B" stroke="#475569" stroke-width="2" filter="url(#shadow)" />
    <text x="145" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Public Feed Sources</text>
    <text x="145" y="50" text-anchor="middle" font-size="11" fill="#E2E8F0">[External Software System]</text>
    <text x="145" y="75" text-anchor="middle" font-size="11" fill="#FFFFFF">GitHub Trending • HN • Reddit • RSS</text>
    <rect x="40" y="92" width="210" height="22" rx="4" fill="#E2E8F0" stroke="#64748B" />
    <text x="145" y="107" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">[ACCEPTED batch contracts]</text>
  </g>

  <!-- ==================== CONNECTORS & LABELS ==================== -->

  <!-- Owner -> Web -->
  <line x1="215" y1="485" x2="285" y2="485" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="223" y="468" width="55" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.9" />
  <text x="250" y="481" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Uses</text>

  <!-- Web -> API -->
  <line x1="560" y1="485" x2="615" y2="485" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="555" y="460" width="55" height="30" rx="3" fill="#FFFFFF" fill-opacity="0.9" />
  <text x="582" y="473" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#374151">HTTPS /</text>
  <text x="582" y="486" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#374151">REST API</text>

  <!-- API -> Snapshot Store -->
  <path d="M 950 410 L 1030 410 L 1030 225 L 1115 225" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="970" y="270" width="175" height="36" rx="4" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2E8F0" />
  <text x="1057" y="284" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">Captures approved revisions</text>
  <text x="1057" y="297" text-anchor="middle" font-size="8.5" fill="#475569">verifies whole-file SHA-256</text>

  <!-- API -> Indexing Worker -->
  <line x1="950" y1="440" x2="1115" y2="440" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="970" y="425" width="160" height="30" rx="4" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2E8F0" />
  <text x="1050" y="437" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">Dispatches prepared inputs</text>
  <text x="1050" y="449" text-anchor="middle" font-size="8.5" fill="#475569">one-use grant • NativeWorkerProcess</text>

  <!-- Indexing Worker -> DB -->
  <line x1="1480" y1="395" x2="1655" y2="395" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="1490" y="372" width="165" height="46" rx="4" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2E8F0" />
  <text x="1572" y="386" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">rag_worker restricted staging</text>
  <text x="1572" y="399" text-anchor="middle" font-size="8.5" fill="#475569">scoped SECURITY DEFINER (db.py)</text>
  <text x="1572" y="411" text-anchor="middle" font-size="8" fill="#64748B">no business reads or direct publish</text>

  <!-- API -> DB (Java Finalization Gate) -->
  <path d="M 785 390 L 785 125 L 1800 125 L 1800 335" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="1120" y="105" width="360" height="38" rx="4" fill="#FFFFFF" fill-opacity="0.98" stroke="#BFDBFE" />
  <text x="1300" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="#1D4ED8">rag_runtime / JPA + SQL (RagDocumentFinalizationGate)</text>
  <text x="1300" y="132" text-anchor="middle" font-size="9" fill="#1E40AF">finalizes &amp; publishes generation batches</text>
  <text x="1300" y="141" text-anchor="middle" font-size="8" fill="#64748B">(no SQL lock spans compute or async emission)</text>

  <!-- API -> Query Worker -->
  <path d="M 950 490 L 1020 490 L 1020 570 L 1115 570" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="915" y="525" width="195" height="44" rx="4" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2E8F0" />
  <text x="1012" y="538" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E293B">Request-bound query loopback</text>
  <text x="1012" y="550" text-anchor="middle" font-size="8" fill="#475569">ADR-0025: reader exclusion spans async</text>
  <text x="1012" y="561" text-anchor="middle" font-size="7.5" fill="#64748B">emission &amp; positive sender/child stop</text>

  <!-- API -> QA Worker (Suspended) -->
  <path d="M 785 585 L 785 750 L 1115 750" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)" />
  <rect x="840" y="730" width="220" height="34" rx="4" fill="#FFFFFF" fill-opacity="0.95" stroke="#FECACA" />
  <text x="950" y="744" text-anchor="middle" font-size="9" font-weight="bold" fill="#DC2626">Archival only • execution disabled</text>
  <text x="950" y="756" text-anchor="middle" font-size="8.5" fill="#991B1B">(zero runtime model loaded / no inference)</text>

  <!-- API -> Storage -->
  <path d="M 950 400 L 1010 400 L 1010 310 L 2015 310" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="1870" y="295" width="120" height="20" rx="3" fill="#FFFFFF" fill-opacity="0.9" />
  <text x="1930" y="309" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#374151">S3-compatible API</text>

  <!-- API -> Feeds: Routed cleanly below Grounded QA Generator at y=855 to completely avoid all worker badges -->
  <path d="M 950 515 L 980 515 L 980 855 L 1980 855 L 1980 545 L 2015 545" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="1450" y="843" width="160" height="24" rx="3" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2E8F0" />
  <text x="1530" y="859" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#374151">Consumes normalized feeds</text>

  <!-- ==================== BOTTOM LEGEND & TRUST BOUNDARIES ==================== -->
  <g transform="translate(250, 990)">
    <rect width="1720" height="145" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="25" y="26" font-size="13" font-weight="bold" fill="#0F172A">System Architecture Status Badges &amp; Lifecycle Boundaries:</text>

    <!-- Badge 1: ACCEPTED -->
    <rect x="25" y="42" width="90" height="22" rx="4" fill="#22C55E" />
    <text x="70" y="57" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">[ACCEPTED]</text>
    <text x="125" y="57" font-size="11" fill="#334155">Production-accepted active capability in v1 baseline (Java modular monolith + PostgreSQL structured data &amp; vector index).</text>

    <!-- Badge 2: ACCEPTED / INACTIVE -->
    <rect x="25" y="74" width="160" height="22" rx="4" fill="#DBEAFE" stroke="#3B82F6" />
    <text x="105" y="89" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">[ACCEPTED / INACTIVE]</text>
    <text x="195" y="89" font-size="11" fill="#334155">Accepted Phase 18 Obsidian Markdown indexing &amp; snapshot storage; ingestion pipeline inactive by default in v1.</text>

    <!-- Badge 3: ACCEPTED S19-1 / DEFAULT_OFF -->
    <rect x="25" y="106" width="195" height="22" rx="4" fill="#DBEAFE" stroke="#3B82F6" />
    <text x="122" y="121" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">[ACCEPTED S19-1 / DEFAULT_OFF]</text>
    <text x="230" y="121" font-size="11" fill="#334155">Accepted S19-1 query embedding loopback process; request-bound opt-in guarded by active reader exclusion (ADR-0025).</text>

    <!-- Badge 4: SUSPENDED -->
    <rect x="970" y="42" width="265" height="22" rx="4" fill="#FEE2E2" stroke="#EF4444" />
    <text x="1102" y="57" text-anchor="middle" font-size="10" font-weight="bold" fill="#B91C1C">[SUSPENDED / NOT_ACCEPTED / ARCHIVAL_ONLY]</text>
    <text x="1245" y="57" font-size="11" fill="#334155">S19-2 suspension decision; zero runtime model loaded, no inference execution.</text>

    <!-- Badge 5: PROPOSED -->
    <rect x="970" y="74" width="105" height="22" rx="4" fill="#FEF3C7" stroke="#D97706" />
    <text x="1002" y="89" text-anchor="middle" font-size="10" font-weight="bold" fill="#B45309">[PROPOSED]</text>
    <text x="1085" y="89" font-size="11" fill="#334155">Proposed future frontend web client; not implemented in backend-first modular monolith baseline.</text>
  </g>
  <!-- GDI26-S1 manual vector delta; existing accepted containers retain their status. -->
  <g id="gdi26-google" transform="translate(2020,680)">
    <rect width="290" height="140" rx="10" fill="#64748B" stroke="#475569" stroke-width="2"/>
    <text x="145" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Google OAuth / OIDC</text>
    <text x="145" y="55" text-anchor="middle" font-size="11" fill="white">Code / refresh / JWKS / revoke only</text>
    <text x="145" y="80" text-anchor="middle" font-size="11" fill="white">S1 REVIEW_PENDING / DEFAULT_OFF</text>
    <text x="145" y="108" text-anchor="middle" font-size="11" fill="white">Live operation NOT_VERIFIED</text>
  </g>
  <path id="gdi26-google-edge" d="M 950 555 L 1000 555 L 1000 905 L 2000 905 L 2000 750 L 2015 750" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="1450" y="887" width="300" height="24" rx="3" fill="white" stroke="#E2E8F0"/>
  <text x="1600" y="903" text-anchor="middle" font-size="10" fill="#374151">Bounded OAuth; no Drive file operation</text>
</svg>
