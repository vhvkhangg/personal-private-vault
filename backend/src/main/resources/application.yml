spring:
  application:
    name: personal-private-vault

  datasource:
    url: ${PPV_DB_URL:jdbc:postgresql://localhost:5432/personal_private_vault}
    username: ${PPV_DB_USERNAME:ppv}
    password: ${PPV_DB_PASSWORD:ppv-local-only}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: ${PPV_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,mediaStorage
        liveness:
          include: livenessState

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.vhvkhangg.personalprivatevault: INFO
    org.hibernate.orm.jdbc.error: ERROR

ppv:
  security:
    jwt:
      issuer: ${PPV_JWT_ISSUER:personal-private-vault}
      access-token-lifetime: ${PPV_JWT_ACCESS_TOKEN_LIFETIME:15m}
      refresh-token-lifetime: ${PPV_JWT_REFRESH_TOKEN_LIFETIME:30d}
      secret: ${PPV_JWT_SECRET:}

vault:
  media:
    storage:
      enabled: ${PPV_MEDIA_STORAGE_ENABLED:false}
      endpoint: ${PPV_MEDIA_STORAGE_ENDPOINT:}
      region: ${PPV_MEDIA_STORAGE_REGION:us-east-1}
      bucket: ${PPV_MEDIA_STORAGE_BUCKET:}
      access-key: ${PPV_MEDIA_STORAGE_ACCESS_KEY:}
      secret-key: ${PPV_MEDIA_STORAGE_SECRET_KEY:}
      path-style-access: ${PPV_MEDIA_STORAGE_PATH_STYLE_ACCESS:true}
      max-file-size: ${PPV_MEDIA_STORAGE_MAX_FILE_SIZE:52428800}
