name: personal-private-vault

services:
  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PPV_DB_NAME:-personal_private_vault}
      POSTGRES_USER: ${PPV_DB_USERNAME:-ppv}
      POSTGRES_PASSWORD: ${PPV_DB_PASSWORD:-ppv-local-only}
    ports:
      - "${PPV_DB_PORT:-5432}:5432"
    volumes:
      - ppv-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PPV_DB_USERNAME:-ppv} -d ${PPV_DB_NAME:-personal_private_vault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PPV_MEDIA_STORAGE_ACCESS_KEY:-ppv-access-key}
      MINIO_ROOT_PASSWORD: ${PPV_MEDIA_STORAGE_SECRET_KEY:-ppv-secret-key-12345}
    ports:
      - "${PPV_MEDIA_STORAGE_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - ppv-minio-data:/data

volumes:
  ppv-postgres-data:
  ppv-minio-data:
