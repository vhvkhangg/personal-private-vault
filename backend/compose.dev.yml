services:
  postgres:
    image: postgres:18.6
    container_name: ppv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PPV_DB_NAME:-personal_private_vault}
      POSTGRES_USER: ${PPV_DB_USERNAME:-ppv}
      POSTGRES_PASSWORD: ${PPV_DB_PASSWORD:-ppv-local-only}
    ports:
      - "${PPV_DB_PORT:-5432}:5432"
    volumes:
      - ppv-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PPV_DB_USERNAME:-ppv} -d ${PPV_DB_NAME:-personal_private_vault}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ppv-postgres-data:
