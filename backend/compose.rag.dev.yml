name: personal-private-vault

services:
  postgres:
    build:
      context: ./dev/rag-postgres
    image: ppv-rag-postgres:18.6-pgvector0.8.6
    environment:
      POSTGRES_DB: ${PPV_DB_NAME:-personal_private_vault}
      POSTGRES_USER: ${PPV_DB_USERNAME:-ppv}
      POSTGRES_PASSWORD: ${PPV_DB_PASSWORD:?Supply the separate development migrator password}
    ports: !override
      - "127.0.0.1:${PPV_DB_PORT:-5432}:5432"
