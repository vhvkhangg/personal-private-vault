# Project-scoped Codex defaults. Loaded when this repository is trusted.
model_verbosity = "low"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[mcp_servers.idea]
url = "http://127.0.0.1:64342/stream"
default_tools_approval_mode = "approve"

# B2-F01 attempt 1/2: native adapter; enforcement requires normal hook trust.
# Untrusted/skipped hooks are NOT verified protection. Existing rules remain active.
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.agents/hooks/repository_safety.py" --codex'
command_windows = 'python .agents/hooks/repository_safety.py --codex'
timeout = 5
